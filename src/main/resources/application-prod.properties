# =============================
# PRODUCTION - SUPABASE PostgreSQL
# =============================

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=TaxDataSupabasePool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=300000

# =============================
# Production admin
# =============================

# Production-da mütləq ENV-dən gəlməlidir.
app.admin.password=${APP_ADMIN_PASSWORD}
app.admin.sync-password-on-startup=${APP_ADMIN_SYNC_PASSWORD:true}

# =============================
# e-Taxes production · LOCAL AGENT
# =============================

# Railway serverində browser yoxdur və e-Taxes avtomatlaşdırması işləmir.
# e-Taxes istifadəçinin Windows kompüterində TaxData Local Agent ilə işləyir.
app.etaxes.execution-mode=LOCAL_AGENT
app.etaxes.browser.headless=false
app.etaxes.browser.server-bundled=false
app.etaxes.browser.executable-path=

# =============================
# Encrypted PostgreSQL disaster recovery
# =============================
app.cloud-backup.enabled=${CLOUD_BACKUP_ENABLED:true}
app.cloud-backup.retention-days=${CLOUD_BACKUP_RETENTION_DAYS:3}
app.cloud-backup.max-versions-per-user=${CLOUD_BACKUP_MAX_VERSIONS:96}
app.cloud-backup.max-zip-bytes=${CLOUD_BACKUP_MAX_ZIP_BYTES:104857600}
app.cloud-backup.auto-replace-minutes=${CLOUD_BACKUP_AUTO_REPLACE_MINUTES:60}
app.cloud-backup.cleanup-ms=${CLOUD_BACKUP_CLEANUP_MS:3600000}
