server.port=${PORT:8080}
spring.application.name=TaxData

# Heç bir profil seçilməsə lokal development açılsın
spring.profiles.default=dev

server.error.include-message=never
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# =============================
# Upload / response limits
# =============================
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:500MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:550MB}

server.compression.enabled=true
server.compression.min-response-size=2048
server.compression.mime-types=application/json,text/html,text/plain,text/css,application/javascript,application/zip,application/octet-stream

# =============================
# Application resources
# =============================
app.storage.root=./data
app.storage.uploads=./data/uploads
app.storage.outputs=./data/output
app.templates.path=classpath:/excel-templates

# =============================
# Authentication
# =============================
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.whatsapp=${APP_ADMIN_WHATSAPP:}
app.whatsapp.url=${APP_WHATSAPP_URL:}

app.auth.session-days=${APP_SESSION_DAYS:7}
app.auth.max-login-failures=${APP_MAX_LOGIN_FAILURES:8}
app.auth.lock-minutes=${APP_LOGIN_LOCK_MINUTES:15}

# =============================
# Local-first temporary storage
# =============================
app.storage.session-root=${APP_TEMP_SESSION_ROOT:}
app.storage.temp-session-max-hours=${APP_TEMP_SESSION_HOURS:24}
app.storage.temp-session-cleanup-ms=${APP_TEMP_SESSION_CLEANUP_MS:3600000}

# =============================
# Actuator
# =============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.defaults.enabled=true

# =============================
# e-Taxes common settings
# =============================
app.etaxes.otp-timeout-seconds=${ETAXES_OTP_TIMEOUT_SECONDS:180}
app.etaxes.task-retention-minutes=${ETAXES_TASK_RETENTION_MINUTES:30}
app.etaxes.max-concurrent-tasks=${ETAXES_MAX_CONCURRENT_TASKS:3}

app.etaxes.login-url=${ETAXES_LOGIN_URL:https://new.e-taxes.gov.az/eportal/login/asan}

# Dinamik e-Taxes gözləmələri: bunlar süni gecikmə deyil, yalnız maksimum təhlükəsizlik limitləridir.
# Şərt daha tez baş verəndə proses dərhal növbəti mərhələyə keçir.
app.etaxes.navigation-timeout-seconds=${ETAXES_NAVIGATION_TIMEOUT_SECONDS:60}
app.etaxes.element-timeout-seconds=${ETAXES_ELEMENT_TIMEOUT_SECONDS:60}
app.etaxes.http-timeout-seconds=${ETAXES_HTTP_TIMEOUT_SECONDS:60}

# =============================
# 3-day encrypted PostgreSQL disaster recovery
# =============================
# Local browser/folder remains the master copy. Production enables a short-retention
# encrypted ZIP copy in PostgreSQL for device loss / cross-device restore.
app.cloud-backup.enabled=${CLOUD_BACKUP_ENABLED:false}
app.cloud-backup.retention-days=${CLOUD_BACKUP_RETENTION_DAYS:3}
app.cloud-backup.max-versions-per-user=${CLOUD_BACKUP_MAX_VERSIONS:96}
app.cloud-backup.max-zip-bytes=${CLOUD_BACKUP_MAX_ZIP_BYTES:104857600}
app.cloud-backup.auto-replace-minutes=${CLOUD_BACKUP_AUTO_REPLACE_MINUTES:60}
app.cloud-backup.cleanup-ms=${CLOUD_BACKUP_CLEANUP_MS:3600000}

# =============================
# Password-encrypted full transfer backup
# =============================
app.transfer-backup.max-encrypted-bytes=${TRANSFER_BACKUP_MAX_ENCRYPTED_BYTES:314572800}
app.transfer-backup.max-inner-bytes=${TRANSFER_BACKUP_MAX_INNER_BYTES:419430400}
app.transfer-backup.pbkdf2-iterations=${TRANSFER_BACKUP_PBKDF2_ITERATIONS:210000}
