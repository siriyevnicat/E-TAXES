# =============================
# DEVELOPMENT DATABASE
# =============================

spring.datasource.url=jdbc:h2:file:./data/authdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.hikari.maximum-pool-size=2

# =============================
# Development admin
# =============================

app.admin.sync-password-on-startup=${APP_ADMIN_SYNC_PASSWORD:false}

# =============================
# e-Taxes local development
# =============================

# Lokal kompüterdə browser pəncərəsi açılsın.
app.etaxes.browser.headless=${ETAXES_BROWSER_HEADLESS:false}

# auto: Windows default/quraşdırılmış Chrome, Edge və ya Brave avtomatik tapılır; heç nə endirilmir.
# Lokal rejimdə layihə heç bir brauzer endirmir. Quraşdırılmış brauzer avtomatik tapılır.
# Tapılmasa UI-dakı “Brauzer seç” düyməsi ilə proqram faylı və ya qovluğu seçilə bilər.
app.etaxes.browser.server-bundled=${ETAXES_BROWSER_SERVER_BUNDLED:false}
app.etaxes.browser.executable-path=${ETAXES_BROWSER_EXECUTABLE_PATH:}